name: Deploy study app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site/src _site/data/extracted _site/data/originals
          cp src/index.html src/styles.css src/app.js _site/src/
          cp data/extracted/questions.js data/extracted/scenario_classification.json _site/data/extracted/
          cp -R data/originals/. _site/data/originals/
          cp .nojekyll _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
